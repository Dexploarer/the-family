# DigitalOcean App Platform spec for BNancy (matches live app).
# Production builds from GitHub on push (deploy_on_push). GHCR images: publish.yml.
name: bnancy
region: sfo
services:
  - name: bot
    instance_count: 1
    instance_size_slug: basic-xxs
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: Dexploarer/BNancy
      branch: main
      deploy_on_push: true
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 30
    envs:
      - key: HTTP_PORT
        scope: RUN_AND_BUILD_TIME
        value: "8080"
      - key: APP_ENV
        value: production
      - key: STORAGE_DRIVER
        value: postgres
      - key: PUBLIC_BASE_URL
        value: ${APP_URL}
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: dexploarer@gmail.com
      # Remaining vars are set in the App Platform dashboard (secrets + plain config).

# DigitalOcean App Platform — deploy from GHCR (digest set by deploy workflow).
# Image: ghcr.io/dexploarer/nancy  (see .github/workflows/deploy.yml + publish.yml)
name: nancy
region: sfo
services:
  - name: bot
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 30
    image:
      registry_type: GHCR
      registry: Dexploarer
      repository: nancy
      digest: ${IMAGE_DIGEST}
    envs:
      - key: HTTP_PORT
        scope: RUN_AND_BUILD_TIME
        value: "8080"
      - key: APP_ENV
        value: production
      - key: STORAGE_DRIVER
        value: postgres
      - key: PUBLIC_BASE_URL
        value: ${APP_URL}
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: dexploarer@gmail.com
      # Remaining vars live in the App Platform dashboard (secrets + plain config).
      # TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, DATABASE_URL, SAFE_API_KEY,
      # PINATA_JWT, ADMIN_SESSION_SECRET, BSC_*, PLATFORM_*, ELIZA_*, AGENTMAIL_API_KEY, etc.

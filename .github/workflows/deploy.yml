name: deploy

# CI gate + optional explicit App Platform redeploy.
# Production deploys automatically on push to main via App Platform deploy_on_push
# (GitHub → Dockerfile build). Container images for ElizaCloud etc. come from publish.yml → GHCR.
#
# Requires: DIGITALOCEAN_ACCESS_TOKEN (repo secret)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Trigger App Platform deployment
        run: doctl apps create-deployment 7d649227-9d40-4b4a-8ae3-62d0a14eea53 --wait

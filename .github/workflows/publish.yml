name: publish

# Build linux/amd64 and push to GitHub Container Registry for ElizaCloud (and any
# other host). Does not touch DigitalOcean — see deploy.yml for the DO path.
#
# Image: ghcr.io/dexploarer/nancy:latest (+ :<git-sha>)
# After the first push, set the package visibility to Public in GitHub
# (Package settings → Change visibility) so ElizaCloud can pull without credentials.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - .dockerignore
      - package.json
      - bun.lock
      - src/**
      - db/**
      - assets/**
      - certs/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/nancy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
